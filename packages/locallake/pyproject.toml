[project]
name = "locallake"
version = "0.0.1"
description = "LocalLake notebook helper — get_connection(), save_artifact(), log()"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locallake"]
