[project]
name = "locallake-workspace"
version = "0.0.1"
description = "LocalLake — local-first Databricks-style workbench"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Fahad Baig" }]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/locallake",
    "packages/locallake_core",
]

[tool.uv.sources]
locallake = { workspace = true }
locallake-core = { workspace = true }
locallake-api = { workspace = true }
locallake-worker = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["workspace", ".venv", "**/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert in tests is fine
# context_template.py is exec'd in a subprocess, not imported — unusual patterns expected
"packages/locallake_core/src/locallake_core/context_template.py" = [
    "F821", "E402", "F811", "I001", "B905", "S110", "S112", "UP",
]
# FastAPI Depends(...) in default args is the framework's documented pattern
"apps/api/src/locallake_api/routes/*.py" = ["B008"]
"apps/api/src/locallake_api/websocket.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["workspace/", "alembic/versions/"]

[[tool.mypy.overrides]]
module = ["locallake_core.context_template"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
