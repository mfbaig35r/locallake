[project]
name = "locallake-api"
version = "0.0.1"
description = "LocalLake FastAPI control plane"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.5.0",
    "websockets>=12.0",
    "itsdangerous>=2.0",
    "arq>=0.26.0",
    # `marimo edit` is launched as a subprocess by the marimo session manager.
    # The CLI must be on PATH inside the API container; declaring it here puts
    # it in the API venv.
    "marimo>=0.10.0",
    "locallake-core",
    # The `locallake` shim has to be importable inside the marimo-edit kernel,
    # otherwise notebooks that do `from locallake import ...` trigger marimo's
    # "kernel not found" banner because the imports can't be resolved.
    "locallake",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locallake_api"]
