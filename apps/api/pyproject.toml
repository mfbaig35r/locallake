[project]
name = "locallake-api"
version = "0.0.1"
description = "LocalLake FastAPI control plane"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.5.0",
    "websockets>=12.0",
    "itsdangerous>=2.0",
    "locallake-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locallake_api"]
